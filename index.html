<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>公開テストだし、BADAPPLEでも再生します - ghepsi</title>
  <style>
    body {
      background-color: #111;
      color: white;
      font-family: sans-serif;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      padding: 20px;
      box-sizing: border-box;
      text-align: center;
    }
    img {
      max-width: 300px;
      height: auto;
      margin-bottom: 10px;
    }
    h1 {
      margin: 10px 0 20px;
      font-size: 2rem;
    }
    canvas {
      max-width: 90%;
      max-height: 60vh;
      /* 角を完全に四角にする（角丸なし） */
      border-radius: 0px;
      background-color: black;
      cursor: pointer;
      /* 拡大時にぼかさず、ピクセルのドット感をくっきりさせる */
      image-rendering: pixelated;
    }
  </style>
</head>
<body>
  <img src="GHEPSI.png" alt="GHEPSIロゴ">
  <h1>公開テスト</h1>

  <!-- 元の動画（裏で再生） -->
  <video id="srcVideo" src="badapple.mp4" autoplay muted loop playsinline style="display: none;"></video>
  <!-- 角ばったカクカク画面（クリックで音のオン/オフ） -->
  <canvas id="choppyCanvas" title="クリックで音オン/オフ"></canvas>

  <script>
    const video = document.getElementById('srcVideo');
    const canvas = document.getElementById('choppyCanvas');
    const ctx = canvas.getContext('2d');

    // ★1. カクカク具合（1秒間のコマ数：小さいほどカクカク）
    const fps = 5;

    // ★2. ピクセルの粗さ（1なら元の画質、0.2などにするとドットが粗くなる）
    const pixelScale = 1;

    video.addEventListener('loadedmetadata', () => {
      canvas.width = video.videoWidth * pixelScale;
      canvas.height = video.videoHeight * pixelScale;
      // 表示サイズを元の動画サイズに合わせる
      canvas.style.width = video.videoWidth + 'px';
      canvas.style.height = video.videoHeight + 'px';
    });

    setInterval(() => {
      if (!video.paused && !video.ended) {
        ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
      }
    }, 1000 / fps);

    // 画面クリックで音のオン・オフ切り替え
    canvas.addEventListener('click', () => {
      video.muted = !video.muted;
    });
  </script>
</body>
</html>
